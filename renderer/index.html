<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>FocusTodoDesktop 2.0</title>
<link rel="stylesheet" href="animal-island.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&display=swap');

/* ── Animal Island UI 设计 Token ─────────────────────────────────────────── */
:root {
  --ac-primary:#19c8b9; --ac-primary-hover:#3dd4c6; --ac-primary-active:#50B9AB; --ac-primary-bg:#e6f9f6;
  --ac-success:#6fba2c; --ac-warning:#f5c31c; --ac-error:#e05a5a; --ac-error-active:#c94444;
  --ac-text:#794f27; --ac-text-2:#9f927d; --ac-text-dis:#c4b89e; --ac-text-label:#725d42;
  --ac-border:#c4b89e; --ac-border-hover:#a89878; --ac-border-light:#e8dcc8;
  --ac-bg:#f8f8f0; --ac-bg-2:#f0e8d8; --ac-bg-card:#f7f3df; --ac-bg-white:#fdfdf5; --ac-bg-input:#f7f3df;
  --ac-shadow-bottom:#d4c9b4; --ac-shadow-primary:#bdaea0;
  --ac-font:'Nunito','Noto Sans SC',Arial,sans-serif;
  --ac-r-sm:12px; --ac-r:20px; --ac-r-lg:28px; --ac-r-pill:50px;
  --ac-shadow:0 3px 10px rgba(61,52,40,.10); --ac-shadow-lg:0 8px 24px rgba(61,52,40,.14);
  --ac-dur:.2s; --ac-ease:cubic-bezier(.4,0,.2,1);
}

* { box-sizing: border-box }
html, body { height: 100%; margin: 0 }
body {
  font-family: var(--ac-font);
  color: var(--ac-text);
  background: var(--ac-bg);
  background-image: radial-gradient(circle, rgba(25,200,185,.05) 1px, transparent 1px);
  background-size: 22px 22px;
}

/* ── 布局 ───────────────────────────────────────────────────────────────── */
.shell { padding: 14px; height: 100%; display: flex; flex-direction: column }
.app { display: grid; grid-template-columns: 300px 6px 1fr 6px 360px; gap: 0; flex: 1; min-height: 0 }
.resizer { width: 6px; cursor: col-resize; border-radius: 999px; background: rgba(25,200,185,.1); margin: 0 2px; transition: background var(--ac-dur) }
.resizer:hover { background: rgba(25,200,185,.25) }

/* ── 面板 Card ──────────────────────────────────────────────────────────── */
.panel {
  background: var(--ac-bg-card);
  border: 2px solid var(--ac-border-light);
  border-radius: var(--ac-r-lg);
  padding: 14px;
  overflow: auto;
  box-shadow: var(--ac-shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: all .3s ease;
}

/* ── 中栏布局 ────────────────────────────────────────────────────────────── */
.mid-grid { display: grid; grid-template-rows: 1fr 1fr auto; gap: 10px; height: 100%; min-height: 0 }
.mid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0 }
.mid-top > .section-card { overflow: auto }

/* ── 区块卡片 ────────────────────────────────────────────────────────────── */
.section-card {
  border: 2px solid var(--ac-border-light);
  background: var(--ac-bg-white);
  border-radius: var(--ac-r);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 3px 0 0 var(--ac-shadow-bottom);
}

/* ── 异形圆角标题徽标（Animal Island card-title 风格）─────────────────── */
.ac-title-badge {
  background: var(--ac-bg-card);
  border-radius: 40px 35px 45px 38px / 38px 45px 35px 40px;
  padding: 5px 14px;
  font-weight: 700;
  font-size: 12px;
  color: var(--ac-text-label);
  display: inline-block;
  border: 1.5px solid var(--ac-border-light);
}

h2, h3 { margin: 0; color: var(--ac-text) }
.row { display: flex; gap: 8px; align-items: center }
.between { justify-content: space-between }
.wrap { flex-wrap: wrap }
.stack { display: flex; flex-direction: column; gap: 8px }

/* ── Input（Animal Island 风格：胶囊形，立体阴影）────────────────────────── */
input, select, textarea {
  font: inherit;
  width: 100%;
  padding: 9px 18px;
  background: var(--ac-bg-input);
  border: 2.5px solid var(--ac-border);
  border-radius: var(--ac-r-pill);
  outline: none;
  color: var(--ac-text-label);
  font-weight: 500;
  transition: all var(--ac-dur) var(--ac-ease);
  box-shadow: 0 3px 0 0 var(--ac-shadow-bottom);
}
input::placeholder { color: var(--ac-text-dis); font-weight: 400 }
input:hover:not(:disabled) { border-color: var(--ac-border-hover); box-shadow: 0 3px 0 0 var(--ac-border) }
input:focus { border-color: var(--ac-primary); box-shadow: 0 3px 0 0 var(--ac-primary-active) }

/* Select 特殊：trigger 风格 */
select {
  border-radius: 12px;
  background: var(--ac-bg-white);
  border: 2px solid var(--ac-border-light);
  box-shadow: 0 2px 0 0 var(--ac-shadow-bottom);
  padding: 8px 13px;
  cursor: pointer;
  appearance: auto;
}
select:focus { border-color: var(--ac-primary); box-shadow: 0 2px 0 0 var(--ac-primary-active) }

/* ── Button（Animal Island 真实规范）──────────────────────────────────────── */
button {
  font: inherit;
  font-weight: 700;
  border: 2px solid transparent;
  border-radius: var(--ac-r-pill);   /* 胶囊形 */
  padding: 0 20px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  outline: none;
  letter-spacing: .02em;
  transition: all var(--ac-dur) var(--ac-ease);
  position: relative;
}

/* Primary：米白底+棕色文字+棕色阴影（原库的 btn-primary 风格） */
button {
  color: var(--ac-text-label);
  background: var(--ac-bg-white);
  border-color: var(--ac-bg-white);
  box-shadow: 0 5px 0 0 var(--ac-shadow-primary);
}
button:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 0 0 var(--ac-shadow-primary);
}
button:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 1px 0 0 var(--ac-shadow-primary);
}
button:disabled { opacity: .5; cursor: not-allowed; box-shadow: none }

/* Ghost：透明底+边框 */
button.ghost {
  background: var(--ac-bg);
  color: var(--ac-text);
  border-color: var(--ac-border);
  box-shadow: 0 3px 0 0 var(--ac-border);
}
button.ghost:hover:not(:disabled) {
  color: var(--ac-primary);
  border-color: var(--ac-primary);
  box-shadow: 0 4px 0 0 var(--ac-shadow-bottom);
}
button.ghost:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 1px 0 0 var(--ac-border);
}

/* Secondary：青绿主色 */
button.secondary {
  background: var(--ac-primary);
  color: #fff;
  border-color: var(--ac-primary);
  box-shadow: 0 5px 0 0 var(--ac-primary-active);
}
button.secondary:hover:not(:disabled) {
  background: var(--ac-primary-hover);
  box-shadow: 0 6px 0 0 var(--ac-primary-active);
}
button.secondary:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 1px 0 0 var(--ac-primary-active);
}

/* Danger */
button.danger {
  color: #fff;
  background: var(--ac-error);
  border-color: var(--ac-error);
  box-shadow: 0 4px 0 0 var(--ac-error-active);
}
button.danger:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 0 var(--ac-error-active) }
button.danger:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 0 var(--ac-error-active) }

/* Small */
button.sm {
  height: 30px;
  padding: 0 12px;
  font-size: 11px;
  border-radius: 16px;
  box-shadow: 0 3px 0 0 var(--ac-shadow-primary);
}
button.ghost.sm { box-shadow: 0 3px 0 0 var(--ac-border) }
button.danger.sm { box-shadow: 0 3px 0 0 var(--ac-error-active) }
button.secondary.sm { box-shadow: 0 3px 0 0 var(--ac-primary-active) }

/* ── Badge & Tag ────────────────────────────────────────────────────────── */
.badge { display:inline-flex; padding:2px 9px; border-radius:999px; font-size:11px; color:#fff; font-weight:700 }
.tag-pill { display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; border:1.5px solid transparent }
.tag-pick { user-select:none; cursor:pointer; transition:all .15s }
.tag-pick:hover { filter:brightness(.9); transform:scale(1.04) }

/* ── Checkbox（Animal Island 风格）──────────────────────────────────────── */
.ac-checkbox {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  flex-shrink: 0;
  background: var(--ac-bg-input);
  border: 2px solid var(--ac-border);
  border-radius: 8px;
  cursor: pointer;
  transition: all var(--ac-dur) var(--ac-ease);
  font-size: 13px;
  color: transparent;
}
.ac-checkbox.checked {
  background: var(--ac-primary);
  border-color: var(--ac-primary-active);
  color: #fff;
}

/* ── 文字 ───────────────────────────────────────────────────────────────── */
.small { font-size: 12px; color: var(--ac-text-2) }
.tiny { font-size: 11px; color: var(--ac-text-2) }

/* ── 空状态 ─────────────────────────────────────────────────────────────── */
.empty {
  padding: 14px;
  border: 2px dashed var(--ac-border-light);
  border-radius: var(--ac-r-sm);
  text-align: center;
  color: var(--ac-text-dis);
  font-size: 13px;
  background: var(--ac-bg);
}

/* ── Modal ──────────────────────────────────────────────────────────────── */
.modal-mask { position:fixed; inset:0; background:rgba(61,52,40,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:100 }
.modal-mask.show { display:flex }
.modal {
  width: min(520px,100%);
  background: var(--ac-bg-white);
  border: 2px solid var(--ac-border-light);
  border-radius: var(--ac-r-lg);
  padding: 18px;
  box-shadow: 0 8px 0 0 var(--ac-shadow-bottom), var(--ac-shadow-lg);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── 番茄钟面板 ─────────────────────────────────────────────────────────── */
.pomo-panel {
  background: linear-gradient(135deg,#19c8b9,#0ea99b 55%,#50B9AB);
  border-radius: var(--ac-r);
  padding: 14px 16px;
  color: #fff;
  flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.2);
  box-shadow: 0 6px 0 0 #0a8a7e, var(--ac-shadow-lg);
}
.pomo-btn-start {
  width: 100%; padding: 10px; font-size: 14px; font-weight: 800;
  background: var(--ac-bg-white); color: var(--ac-primary-active);
  border: 2px solid rgba(255,255,255,.4); border-radius: var(--ac-r-sm);
  cursor: pointer; box-shadow: 0 4px 0 0 rgba(10,138,126,.35);
  transition: all .15s; font-family: var(--ac-font);
}
.pomo-btn-start:hover { transform: translateY(-1px); box-shadow: 0 5px 0 0 rgba(10,138,126,.35) }
.pomo-btn-start:active { transform: translateY(3px); box-shadow: 0 1px 0 0 rgba(10,138,126,.35) }

/* ── 任务行 ─────────────────────────────────────────────────────────────── */
.todo-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border: 2px solid var(--ac-border-light);
  border-radius: var(--ac-r-sm);
  background: var(--ac-bg);
  font-size: 13px;
  cursor: default;
  transition: all var(--ac-dur);
  box-shadow: 0 2px 0 0 var(--ac-border-light);
}
.todo-row:hover { border-color: var(--ac-border); box-shadow: 0 3px 0 0 var(--ac-border); transform: translateY(-1px) }
.todo-row.done .todo-title { text-decoration: line-through; opacity: .5 }
.todo-check { font-size: 16px; cursor: pointer; flex-shrink: 0; user-select: none; color: var(--ac-primary) }
.todo-title { flex: 1; min-width: 0; color: var(--ac-text-label); font-weight: 500 }
.todo-meta { font-size: 12px; color: var(--ac-text-2); flex-shrink: 0 }

/* ── 日常任务行 ─────────────────────────────────────────────────────────── */
.routine-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px;
  border: 2px solid var(--ac-border-light);
  border-radius: var(--ac-r-sm);
  background: var(--ac-bg);
  font-size: 13px;
  box-shadow: 0 2px 0 0 var(--ac-border-light);
  transition: all var(--ac-dur);
}
.routine-row:hover { border-color: var(--ac-border); transform: translateY(-1px) }
.routine-row.done .routine-title { text-decoration: line-through; opacity: .5 }

/* ── 任务堆标签 ─────────────────────────────────────────────────────────── */
.task-stack-label { font-size:11px; font-weight:700; color:var(--ac-text-2); padding:4px 6px; display:flex; align-items:center; gap:6px }
.task-stack-area { flex:1; overflow:auto }

/* ── 统计卡片 ───────────────────────────────────────────────────────────── */
.stat-card {
  background: var(--ac-bg-white);
  border: 2px solid var(--ac-border-light);
  border-radius: var(--ac-r-sm);
  padding: 8px;
  text-align: center;
  box-shadow: 0 3px 0 0 var(--ac-shadow-bottom);
}

/* ── 柱状图 ─────────────────────────────────────────────────────────────── */
.bar { display:flex; align-items:center; gap:8px }
.bar-track { flex:1; height:10px; border-radius:999px; background:var(--ac-border-light); overflow:hidden }
.bar-fill { height:100%; background:linear-gradient(90deg,var(--ac-primary),#6fba2c); border-radius:999px }

/* ── 范围按钮 ───────────────────────────────────────────────────────────── */
.rangeBtn { background: var(--ac-bg); color: var(--ac-text-2); border-color: var(--ac-border-light); box-shadow: 0 3px 0 0 var(--ac-shadow-bottom) }
.rangeBtn.active { background: #0CC0B5; color: #FFF9E3; border-color: #0CC0B5; box-shadow: 0 3px 0 0 var(--ac-primary-active) }
.rangeBtn:hover:not(.active):not(:disabled) { color: var(--ac-primary); border-color: var(--ac-primary) }

/* ── 活动双列 ───────────────────────────────────────────────────────────── */
.activity-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; font-size:11px }
.activity-grid.single { grid-template-columns:1fr }

/* ── 滚动条 ─────────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width:6px; height:6px }
::-webkit-scrollbar-track { background:var(--ac-bg); border-radius:999px }
::-webkit-scrollbar-thumb { background:var(--ac-border); border-radius:999px }
::-webkit-scrollbar-thumb:hover { background:var(--ac-border-hover) }

/* ── Confetti ───────────────────────────────────────────────────────────── */
@keyframes confettiSlide { 0%{transform:translateX(-100%);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(100%);opacity:0} }


/* ── 官方组件 class 映射 ─────────────────────────────────────────────────── */
/* 把我们的 button 样式重定向到官方 class */
button:not([class]) {
  /* 无 class 按钮用官方 primary 风格（直接覆盖） */
}

/* 让所有按钮默认用官方基础样式 */
button {
  font-family: var(--animal-font-family) !important;
}

/* ghost → default 风格 */
button.ghost {
  color: var(--animal-text-color) !important;
  background: var(--animal-bg-color) !important;
  border: 2px solid var(--animal-border-color) !important;
  box-shadow: 0 3px 0 0 #c4b89e !important;
  border-radius: 50px !important;
  font-weight: 600 !important;
}
button.ghost:hover:not(:disabled) {
  color: var(--animal-primary-color) !important;
  border-color: var(--animal-primary-color) !important;
  transform: translateY(-1px) !important;
  box-shadow: 0 4px 0 0 #c4b89e !important;
}
button.ghost:active:not(:disabled) {
  transform: translateY(2px) !important;
  box-shadow: 0 1px 0 0 #c4b89e !important;
}

/* 主要按钮 (无 class / .primary) */
button:not(.ghost):not(.secondary):not(.danger):not(.sm) {
  color: #794f27 !important;
  background: #f8f8f0 !important;
  border: 2px solid #f8f8f0 !important;
  border-radius: 50px !important;
  box-shadow: 0 5px 0 0 #bdaea0 !important;
  font-weight: 700 !important;
}
button:not(.ghost):not(.secondary):not(.danger):not(.sm):hover:not(:disabled) {
  transform: translateY(-1px) !important;
  box-shadow: 0 6px 0 0 #bdaea0 !important;
}
button:not(.ghost):not(.secondary):not(.danger):not(.sm):active:not(:disabled) {
  transform: translateY(2px) !important;
  box-shadow: 0 1px 0 0 #bdaea0 !important;
}

/* secondary → 青绿主色 */
button.secondary {
  color: #fff !important;
  background: var(--animal-primary-color) !important;
  border: 2px solid var(--animal-primary-color) !important;
  border-radius: 50px !important;
  box-shadow: 0 5px 0 0 var(--animal-primary-color-active) !important;
  font-weight: 700 !important;
}
button.secondary:hover:not(:disabled) { transform: translateY(-1px) !important; box-shadow: 0 6px 0 0 var(--animal-primary-color-active) !important; }
button.secondary:active:not(:disabled) { transform: translateY(2px) !important; box-shadow: 0 1px 0 0 var(--animal-primary-color-active) !important; }

/* danger */
button.danger {
  color: #fff !important;
  background: var(--animal-error-color) !important;
  border: 2px solid var(--animal-error-color) !important;
  border-radius: 50px !important;
  box-shadow: 0 4px 0 0 var(--animal-error-color-active) !important;
  font-weight: 700 !important;
}
button.danger:hover:not(:disabled) { transform: translateY(-1px) !important; box-shadow: 0 5px 0 0 var(--animal-error-color-active) !important; }
button.danger:active:not(:disabled) { transform: translateY(2px) !important; box-shadow: 0 1px 0 0 var(--animal-error-color-active) !important; }

/* sm modifier */
button.sm {
  height: 30px !important;
  padding: 0 12px !important;
  font-size: 11px !important;
  border-radius: 16px !important;
}

/* Input → 官方 wrapper 风格 */
input:not([type=number]):not([type=hidden]) {
  background: #f7f3df !important;
  border: 2.5px solid #c4b89e !important;
  border-radius: 50px !important;
  color: #725d42 !important;
  font-weight: 500 !important;
  box-shadow: 0 3px 0 0 #d4c9b4 !important;
  font-family: var(--animal-font-family) !important;
}
input:not([type=number]):not([type=hidden]):focus {
  border-color: var(--animal-primary-color) !important;
  box-shadow: 0 3px 0 0 var(--animal-primary-color-active) !important;
}
input::placeholder { color: #c4b89e !important; font-weight: 400 !important; }
input[type=number] {
  background: #f7f3df !important;
  border: 2px solid #c4b89e !important;
  border-radius: 12px !important;
  color: #725d42 !important;
}

/* Select */
select {
  background: #fff !important;
  border: 2px solid #e8dcc8 !important;
  border-radius: 12px !important;
  color: #725d42 !important;
  font-weight: 600 !important;
  font-family: var(--animal-font-family) !important;
  box-shadow: 0 2px 0 0 #d4c9b4 !important;
}
select:focus {
  border-color: var(--animal-primary-color) !important;
  box-shadow: 0 2px 0 0 var(--animal-primary-color-active) !important;
  outline: none !important;
}

/* Panel/Card → 官方 card 风格 */
.panel {
  background: #f7f3df !important;
  border: 2px solid #e8dcc8 !important;
}
.section-card {
  background: #fdfdf5 !important;
  border: 2px solid #e8dcc8 !important;
  box-shadow: 0 3px 0 0 #d4c9b4 !important;
}
.panel:hover { transform: translateY(-1px); }

/* Checkbox → 官方样式 */
.ac-checkbox {
  background: #f7f3df !important;
  border: 2px solid #c4b89e !important;
  border-radius: 8px !important;
}
.ac-checkbox.checked {
  background: var(--animal-primary-color) !important;
  border-color: var(--animal-primary-color-active) !important;
}

/* tag pill */
.tag-pill {
  font-family: var(--animal-font-family) !important;
  font-weight: 700 !important;
}

/* Tabs（范围按钮用官方 tab 风格）*/
.rangeBtn {
  background: transparent !important;
  color: var(--animal-text-color) !important;
  border: none !important;
  border-radius: 24px !important;
  box-shadow: none !important;
  font-weight: 500 !important;
}
.rangeBtn:hover:not(.active) {
  background: rgba(25,200,185,.1) !important;
  transform: none !important;
  box-shadow: none !important;
}
.rangeBtn.active {
  background: #0cc0b5 !important;
  color: #fff9e3 !important;
  font-weight: 600 !important;
  box-shadow: 0 3px 0 0 rgba(61,52,40,.08) !important;
  border-radius: 24px !important;
}
/* 范围按钮容器 tab-list 风格 */
.rangeBtn-group {
  display: flex;
  gap: 4px;
  padding: 8px;
  background: rgba(255,255,255,.6);
  border-radius: 32px;
  border: 2px solid #e8e2d6;
}

/* stat card */
.stat-card {
  background: #fdfdf5 !important;
  border: 2px solid #e8dcc8 !important;
  box-shadow: 0 3px 0 0 #d4c9b4 !important;
  border-radius: 16px !important;
}

/* modal 用官方风格 */
.modal {
  background: #f7f3df !important;
  border: 2px solid #e8dcc8 !important;
  box-shadow: 0 8px 0 0 #d4c9b4, 0 8px 24px rgba(61,52,40,.14) !important;
}

/* empty 用官方 dashed card 风格 */
.empty {
  border: 2px dashed #e8dcc8 !important;
  background: #faf8f2 !important;
  color: var(--animal-text-color-disabled) !important;
}

/* body 背景 */
body {
  background: var(--animal-bg-color) !important;
  background-image: radial-gradient(circle, rgba(25,200,185,.05) 1px, transparent 1px) !important;
  background-size: 22px 22px !important;
  font-family: var(--animal-font-family) !important;
}

</style>
</head>
<body>
<div class="shell">
<div class="app" id="app">

  <!-- ══ 左栏 ══ -->
  <div class="panel" id="leftPanel">
    <!-- 番茄钟入口 -->
    <div class="pomo-panel" id="pomodoroEntry">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span id="pomoStatusLabel" style="font-size:11px;opacity:.8">准备开始</span>
        <div style="display:flex;gap:6px">
          <span id="pomoModeBadge" style="font-size:10px;padding:2px 8px;background:rgba(255,255,255,.15);border-radius:999px">倒计时</span>
          <button id="pomoExitFocusBtn" style="display:none;padding:3px 9px;font-size:10px;background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;cursor:pointer">退出专注</button>
        </div>
      </div>
      <div id="pomoTimerDisplay" style="font-size:52px;font-weight:900;text-align:center;letter-spacing:1px;cursor:pointer;user-select:none;margin:4px 0 8px" title="点击切换正/倒计时">25:00</div>
      <!-- 时间轴 -->
      <div id="pomoTimeline" style="display:flex;gap:2px;height:18px;border-radius:6px;overflow:hidden;margin-bottom:8px"></div>
      <!-- 分类+任务 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">
        <select id="pomoCatSelect" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:10px;padding:5px 8px;font-size:11px"></select>
        <select id="pomoTaskSelect" style="background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:10px;padding:5px 8px;font-size:11px"></select>
      </div>
      <!-- 按钮 -->
      <div style="display:flex;gap:6px">
        <button id="pomoStartBtn" class="pomo-btn-start" style="flex:3">▶ 开始专注</button>
        <button id="pomoPauseBtn" style="display:none;flex:3;padding:10px;font-size:13px;font-weight:700;background:rgba(255,255,255,.25);color:#fff;border:none;border-radius:12px;cursor:pointer">⏸ 暂停</button>
        <button id="pomoFinishBtn" style="display:none;flex:3;padding:10px;font-size:12px;font-weight:700;background:rgba(34,197,94,.8);color:#fff;border:none;border-radius:12px;cursor:pointer">✅ 完成专注</button>
        <button id="pomoResetBtn" style="flex:1;padding:10px;font-size:13px;background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:12px;cursor:pointer">↺</button>
      </div>
    </div>
    <!-- 统计 -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <div id="statActive" class="stat-card"><div style="font-size:22px;font-weight:800">0</div><div class="tiny">未完成</div></div>
      <div id="statDone" class="stat-card"><div style="font-size:22px;font-weight:800">0</div><div class="tiny">已完成</div></div>
      <div id="statMin" class="stat-card"><div style="font-size:22px;font-weight:800">0</div><div class="tiny">专注分钟</div></div>
    </div>
    <!-- 任务堆 -->
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span class="ac-title-badge">📦 任务堆</span>
      <div class="row">
        <button id="addTaskBtn" class="secondary sm">＋ 添加</button>
        <button id="manageTagsBtn" class="ghost sm">Tag</button>
      </div>
    </div>
    <!-- tag 筛选 -->
    <div id="taskStackTagBar" style="display:flex;flex-wrap:wrap;gap:4px"></div>
    <!-- 任务堆列表 -->
    <div id="taskStackList" class="task-stack-area stack"></div>
  </div>

  <div class="resizer" data-type="left"></div>

  <!-- ══ 中栏 ══ -->
  <div class="panel" id="midPanel">
    <div class="mid-grid">
      <!-- 上：普通委托 + 通缉讨伐 -->
      <div class="mid-top">
        <div class="section-card">
          <div class="row between">
            <span class="ac-title-badge">📋 普通委托</span>
            <button id="addNormalBtn" class="ghost sm">＋</button>
          </div>
          <div id="normalList" class="stack"></div>
        </div>
        <div class="section-card">
          <div class="row between">
            <span class="ac-title-badge">⚔️ 通缉讨伐</span>
            <button id="addUrgentBtn" class="ghost sm">＋</button>
          </div>
          <div id="urgentList" class="stack"></div>
        </div>
      </div>
      <!-- 下：日常任务 -->
      <div class="section-card" style="min-height:0;overflow:auto">
        <div class="row between" style="flex-shrink:0">
          <span class="ac-title-badge">🔄 日常任务</span>
          <button id="addRoutineBtn" class="ghost sm">＋</button>
        </div>
        <div id="routineList" class="stack" style="overflow:auto"></div>
      </div>
    </div>
  </div>

  <div class="resizer" data-type="right"></div>

  <!-- ══ 右栏 ══ -->
  <div class="panel" id="rightPanel">
    <div class="row between wrap">
      <span class="ac-title-badge" style="font-size:14px">📊 总结中心</span>
      <div class="row wrap rangeBtn-group" style="gap:0">
        <button class="rangeBtn ghost sm active" data-range="day">今日</button>
        <button class="rangeBtn ghost sm" data-range="week">本周</button>
        <button class="rangeBtn ghost sm" data-range="month">本月</button>
        <button class="rangeBtn ghost sm" data-range="year">本年</button>
      </div>
    </div>
    <div id="summaryHighlights" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
    <div id="summaryContent" class="stack"></div>
  </div>

</div>
</div>

<!-- 专注模式覆盖层 -->
<!-- 添加/编辑任务 Modal -->
<div class="modal-mask" id="taskModal">
  <div class="modal">
    <div class="row between"><h3 id="taskModalTitle">添加任务</h3><button id="closeTaskModal" class="ghost sm">关闭</button></div>
    <input id="taskTitleInput" placeholder="任务内容"/>
    <div>
      <div class="tiny" style="margin-bottom:4px">板块</div>
      <select id="taskBucketSelect">
        <option value="normal">普通委托</option>
        <option value="urgent">通缉讨伐</option>
      </select>
    </div>
    <div>
      <div class="tiny" style="margin-bottom:4px">番茄数</div>
      <input id="taskPomodorosInput" type="number" min="1" value="1" style="width:80px"/>
    </div>
    <div>
      <div class="tiny" style="margin-bottom:4px">Tag</div>
      <div id="taskTagPicker" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>
    <input type="hidden" id="taskEditingId"/>
    <div class="row between">
      <button id="deleteTaskBtn" class="danger sm" style="display:none">删除任务</button>
      <button id="saveTaskBtn" style="margin-left:auto">保存</button>
    </div>
  </div>
</div>

<!-- 添加/编辑日常任务 Modal -->
<div class="modal-mask" id="routineModal">
  <div class="modal">
    <div class="row between"><h3 id="routineModalTitle">添加日常任务</h3><button id="closeRoutineModal" class="ghost sm">关闭</button></div>
    <input id="routineTitleInput" placeholder="任务名称"/>
    <div>
      <div class="tiny" style="margin-bottom:4px">每周频次（0=无要求）</div>
      <select id="routineFreqSelect">
        <option value="0">无要求</option>
        <option value="1">1次/周</option><option value="2">2次/周</option><option value="3">3次/周</option>
        <option value="4">4次/周</option><option value="5">5次/周</option><option value="6">6次/周</option>
        <option value="7">每天</option>
      </select>
    </div>
    <div>
      <div class="tiny" style="margin-bottom:4px">Tag</div>
      <div id="routineTagPicker" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>
    <input type="hidden" id="routineEditingId"/>
    <div class="row" style="justify-content:flex-end"><button id="saveRoutineBtn">保存</button></div>
  </div>
</div>

<!-- Tag 管理 Modal -->
<div class="modal-mask" id="tagMgrModal">
  <div class="modal">
    <div class="row between"><h3>管理 Tag</h3><button id="closeTagMgrModal" class="ghost sm">关闭</button></div>
    <div class="row"><input id="newTagInput" placeholder="新 tag 名称"/><button id="addTagBtn">新增</button></div>
    <div id="tagMgrList" class="stack"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
