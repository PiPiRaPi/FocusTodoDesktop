<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>悬浮番茄钟</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:"Segoe UI",Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#0f172a,#111827 45%,#312e81);color:#fff;overflow-y:auto}
.wrap{padding:14px}.top{display:flex;justify-content:space-between;align-items:center;cursor:move}
.row{display:flex;gap:8px;align-items:center}
.timer{font-size:54px;font-weight:900;text-align:center;letter-spacing:1px;margin:12px 0 4px;transition:color .3s}
.sub{font-size:12px;color:#cbd5e1;text-align:center}
.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);font-size:12px}
.panel{margin-top:10px;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:12px;background:rgba(255,255,255,.06)}
button,select,input{font:inherit;border:none;border-radius:12px;padding:9px 12px}
button{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;cursor:pointer}
.ghost{background:#374151;color:#fff} .danger{background:#7f1d1d;color:#fff}
.finish{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-weight:700;font-size:15px;padding:12px 18px;width:100%;margin-top:8px;display:none}
.finish.show{display:block}
select,input{width:100%;background:#fff;color:#111827;margin-top:6px}
.tiny{font-size:11px;color:#94a3b8;text-align:center;margin-top:8px}
.progress{height:10px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#a3e635);transition:background .3s}
.fill.overtime{background:linear-gradient(90deg,#f59e0b,#eab308)}
.fill.rest{background:linear-gradient(90deg,#22c55e,#16a34a)}
.label{font-size:11px;color:#94a3b8;margin-bottom:2px;margin-top:10px}
.cat-editor{display:none;margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.cat-editor.show{display:block}
.cat-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid rgba(255,255,255,.1);border-radius:12px;margin-top:6px;background:rgba(255,255,255,.06)}
.cat-item button{padding:6px 10px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="pill">🍅 悬浮番茄钟</div>
    <div class="row">
      <button id="minBtn" class="ghost">最小化</button>
      <button id="closeBtn" class="danger">关闭</button>
    </div>
  </div>
  <div class="panel">
    <div id="phase" class="sub">准备开始 25 分钟专注</div>
    <div id="timer" class="timer">25:00</div>
    <div class="progress"><div id="fill" class="fill"></div></div>

    <div style="margin-top:10px">
      <div class="row" style="justify-content:space-between">
        <span class="label" style="margin:0">计时分类</span>
        <button id="editCatBtn" class="ghost" style="padding:4px 10px;font-size:11px">编辑分类</button>
      </div>
      <select id="category"></select>
    </div>

    <!-- 分类编辑区（默认隐藏）-->
    <div id="catEditor" class="cat-editor">
      <div class="row"><input id="catNewInput" placeholder="输入新分类名" /><button id="catAddBtn" style="flex-shrink:0">新增</button></div>
      <div id="catList"></div>
    </div>

    <div style="margin-top:8px">
      <div class="label">绑定任务（可选）</div>
      <select id="taskSelect"><option value="">-- 不绑定任务 --</option></select>
    </div>

    <div class="row" style="margin-top:12px">
      <button id="startBtn">开始</button>
      <button id="pauseBtn" class="ghost">暂停</button>
      <button id="nextBtn" class="ghost">下一轮</button>
    </div>
    <button id="finishBtn" class="finish">✅ 完成专注</button>
    <div class="tiny">专注结束后进入加时，手动点完成才进入休息</div>
  </div>
</div>
<script src="pomodoro.js"></script>
</body>
</html>
